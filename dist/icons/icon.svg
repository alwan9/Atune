<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#08090d" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="url(#neonGrad)" stroke-width="6" opacity="0.6" />
  
  <!-- Outer glowing rings / vinyl groove effect -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="2" opacity="0.3" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />
  
  <!-- Glowing Center Disc -->
  <circle cx="256" cy="256" r="100" fill="#1e293b" />
  <circle cx="256" cy="256" r="96" fill="url(#neonGrad)" opacity="0.2" filter="url(#glow)" />
  
  <!-- Music Note & Sound Wave Symbol -->
  <g fill="url(#neonGrad)">
    <!-- Main Double Note -->
    <path d="M 230 150 C 230 145 235 140 240 140 L 310 126 C 315 125 320 130 320 135 L 320 250 C 312 245 301 242 290 242 C 265 242 245 258 245 278 C 245 298 265 314 290 314 C 315 314 335 298 335 278 L 335 170 L 250 185 L 250 280 C 242 275 231 272 220 272 C 195 272 175 288 175 308 C 175 328 195 344 220 344 C 245 344 265 328 265 308 L 265 150 Z" />
    
    <!-- Audio Wave Bars on Left and Right -->
    <rect x="110" y="236" width="10" height="40" rx="5" opacity="0.7"/>
    <rect x="130" y="216" width="10" height="80" rx="5" opacity="0.85"/>
    <rect x="150" y="196" width="10" height="120" rx="5" opacity="1"/>
    
    <rect x="350" y="196" width="10" height="120" rx="5" opacity="1"/>
    <rect x="370" y="216" width="10" height="80" rx="5" opacity="0.85"/>
    <rect x="390" y="236" width="10" height="40" rx="5" opacity="0.7"/>
  </g>
</svg>
